syntax = "proto3";

package orders.v1;

option go_package = "example.com/shop/backend/gen/go/orders/v1;ordersv1";

// ایمپورت استاندارد ولیدیشن Buf
import "buf/validate/validate.proto";

// درخواست ایجاد سفارش
message CreateOrderRequest {
  // شناسه کاربر باید حتماً پر باشد و یک UUID استاندارد باشد
  string user_id = 1 [(buf.validate.field).required = true,(buf.validate.field).string.uuid = true];

  // شناسه محصول اجباری است و طول آن باید بین ۳ تا ۶۴ کاراکتر باشد
  string product_id = 2 [(buf.validate.field).required = true, (buf.validate.field).string = {min_len: 3, max_len: 64}];

  // تعداد خرید: باید حداقل ۱ و حداکثر ۱۰۰ عدد باشد (جلوگیری از صفر یا مقادیر تخریبی)
  uint32 quantity = 3 [(buf.validate.field).uint32 = {gte: 1, lte: 100}];
}

// پاسخ ایجاد سفارش
message CreateOrderResponse {
  // شناسه سفارش تولید شده باید UUID باشد
  string order_id = 1 [(buf.validate.field).string.uuid = true];

  // وضعیت سفارش فقط می‌تواند یکی از مقادیر مشخص باشد
  string status = 2 [(buf.validate.field).string = {in: ["PENDING", "PROCESSING", "COMPLETED", "FAILED"]}];
}

// درخواست دریافت سفارش
message GetOrderRequest {
  // شناسه سفارشی که کاربر استعلام می‌کند باید حتماً پر بوده و فرمت UUID معتبر داشته باشد
  string order_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
}

// پاسخ دریافت سفارش
message GetOrderResponse {
  string order_id = 1 [(buf.validate.field).string.uuid = true];
  
  string product_id = 2 [(buf.validate.field).string = {min_len: 3, max_len: 64}];

  uint32 quantity = 3 [(buf.validate.field).uint32.gte = 1];

  string status = 4 [(buf.validate.field).string = {in: ["PENDING", "PROCESSING", "COMPLETED", "CANCELLED", "REFUNDED"]}];
}


